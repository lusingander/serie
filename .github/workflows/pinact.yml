name: Pinact

on:
  push:
    branches:
      - '*'
    paths:
      - .github/**
  pull_request:
    branches:
      - master
    paths:
      - .github/**

jobs:
  pinact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pinact
        uses: suzuki-shunsuke/pinact-action@896d595f299e71d65b9d28349d6956abe144390a # v3.0.0
        with:
          skip_push: "true"
          fix: "false"
          verify: "true"
          excludes: |
            dtolnay/rust-toolchain
